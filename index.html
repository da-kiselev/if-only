<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>if only: условные предложения</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600;700&family=Permanent+Marker&family=Rubik+Wet+Paint&display=swap" rel="stylesheet">
<style>
/* эмо 2000-х: чёрный, ярко-розовый, шахматка как на кедах, сетлист на скотче */
:root{
  color-scheme:dark;
  --paper:#0C0A0E;--sheet:#17141B;--sheet2:#211D27;--ink:#F4F1F6;--muted:#A9A1B3;--line:#3A3442;--edge:#5A5363;
  --pink:#FF2E88;--pink-ink:#0C0A0E;
  --z:#8FB2D9;--f:#7FA0FF;--s:#FF5CA8;--t:#B98CFF;--m:#FF9A57;--w:#4FD8C0;
  --ok:#9BF06A;--bad:#FF5468;--hl:rgba(255,46,136,.55);
  --sl-paper:#F3F0EA;--sl-ink:#121014;--sl-muted:#5A5560;--sl-pink:#D3105F;
  --tape:#18161B;--tape-ink:#F3F0EA;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --marker:"Permanent Marker","Caveat",cursive;
  --drip:"Rubik Wet Paint","Permanent Marker",cursive;
  --ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--paper)}
body{margin:0;color:var(--ink);font:400 16px/1.55 var(--ui);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 50% at 50% -8%,rgba(255,46,136,.20),transparent 62%),var(--paper);min-height:100vh}
.checker{height:14px;background:repeating-conic-gradient(var(--sl-paper) 0 25%,var(--paper) 0 50%) 0 0/14px 14px}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 40px;overflow-x:clip}
.k-z{--c:var(--z)} .k-f{--c:var(--f)} .k-s{--c:var(--s)} .k-t{--c:var(--t)} .k-m{--c:var(--m)} .k-w{--c:var(--w)}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
::selection{background:var(--pink);color:var(--pink-ink)}

/* сетлист: рваная бумага на скотче и булавке */
.setlist{position:relative;isolation:isolate;color:var(--sl-ink);max-width:560px;margin:30px auto 10px;padding:28px 22px 30px;transform:rotate(-1.2deg);
  filter:drop-shadow(0 12px 16px rgba(0,0,0,.65))}
.setlist::before{content:"";position:absolute;inset:0;z-index:-1;background:
  repeating-linear-gradient(transparent 0 31px,rgba(18,16,20,.06) 31px 32px),var(--sl-paper);
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 9px) no-repeat,conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) bottom/14px 9px repeat-x}
.tape{position:absolute;top:-12px;left:14px;width:92px;height:26px;background:var(--tape);opacity:.95;transform:rotate(-7deg);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.pin{position:absolute;top:-16px;right:18px;width:74px;height:30px;transform:rotate(18deg)}
.band{font:400 clamp(3.2rem,15vw,5rem)/.9 var(--drip);margin:0;color:var(--sl-pink);letter-spacing:.01em}
.venue{font:600 .95rem/1.4 var(--ui);color:var(--sl-muted);margin:8px 0 14px}
.venue .tour{display:inline-block;font:400 .95rem/1 var(--marker);color:var(--sl-ink);margin-right:6px}
.songs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:2px 14px}
.song{position:relative;font:700 clamp(1.3rem,5.6vw,1.65rem)/1.15 var(--hand);background:none;border:0;color:inherit;padding:3px 6px 3px 2px;cursor:pointer;text-align:left;display:inline-flex;gap:6px;align-items:baseline}
.song .n{opacity:.5;min-width:1.1em;flex:none}
.song.cur{background:linear-gradient(transparent 50%,var(--hl) 50%,var(--hl) 92%,transparent 92%)}
.song.done::after{content:"";position:absolute;left:1.4em;right:2px;top:52%;height:3px;border-radius:2px;background:currentColor;opacity:.8;transform:rotate(-2deg)}
.song:focus-visible{outline:2px solid var(--sl-ink);outline-offset:2px}
.saverow{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 10px;font-size:.85rem;color:var(--muted);margin:6px 0 0;text-align:center}
.linkbtn{font:inherit;background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.linkbtn:hover{color:var(--pink)}

/* карточки */
.card{background:var(--sheet);border:1px solid var(--line);border-radius:2px;padding:20px 18px;margin-top:18px;box-shadow:5px 5px 0 #000}
h2{font:700 1.3rem/1.25 var(--ui);margin:0 0 10px;letter-spacing:-.01em}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.tag{display:inline-block;font:700 .72rem/1.4 var(--ui);padding:1px 8px;border-radius:2px;background:var(--sheet2);color:var(--muted);border:1px solid var(--edge);vertical-align:middle;margin-left:6px;letter-spacing:.03em}
.tag.c1{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag.again{background:var(--pink);color:var(--pink-ink);border-color:var(--pink)}

/* сетка «два вопроса» */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 12px}
.gh{font:600 .85rem/1.3 var(--ui);color:var(--muted);padding:0 2px;align-self:end}
.gr{grid-column:1/-1;font:700 1.45rem/1 var(--hand);margin-top:8px;padding-left:2px;color:var(--pink)}
.cell{padding:12px;border-radius:2px;border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);background:var(--sheet2);background:color-mix(in srgb,var(--c) 12%,var(--sheet));min-width:0}
.cell .cn{font:700 1.6rem/1 var(--hand);color:var(--c);margin:0 0 2px}
.cell .cd{font-size:.88rem;color:var(--muted);margin:0 0 8px}
.cell.dim{--c:var(--muted);border-style:dashed}
.rule{border-left:4px solid var(--pink);padding:4px 0 4px 12px;margin:12px 0 0}

/* карточки типов */
.tcard{border-left:6px solid var(--c)}
.tname{font:400 2.2rem/1.05 var(--marker);color:var(--c);margin:0 0 8px}
.when{margin:0 0 10px}
.formula{display:inline-block;margin:0 8px 8px 0;background:var(--sl-paper);color:var(--sl-ink);font:700 .9rem/1.35 var(--ui);padding:5px 12px;transform:rotate(-.6deg);box-shadow:2px 2px 0 #000}
.formula:nth-of-type(even){transform:rotate(.5deg)}
.exs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin:4px 0 8px}
.say{display:inline-flex;align-items:baseline;gap:8px;font:500 .97rem/1.4 var(--ui);background:var(--sheet2);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:6px 10px;cursor:pointer;text-align:left;max-width:100%}
.say:hover{border-color:var(--pink)}
.say b{color:var(--c,var(--pink));font-weight:700}
.say .spk{flex:none;color:var(--muted);position:relative;top:1px}
.note{font-size:.93rem;color:var(--muted);margin:8px 0 0}
.note b{color:var(--ink)}

.trap .ru{font:600 1.15rem/1.4 var(--ui);margin:0 0 10px}
.trow{display:grid;grid-template-columns:minmax(0,11em) 1fr;gap:4px 14px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.trow .lab{font:700 1.35rem/1.1 var(--hand)}
.brow{display:grid;grid-template-columns:minmax(0,11em) 1fr;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line)}
.brow .w{font-weight:700}
.brow .m{color:var(--muted);font-size:.9rem}
.brow .exs{margin:0}
.drow{display:grid;grid-template-columns:minmax(0,12em) 1fr;gap:2px 14px;padding:8px 0;border-top:1px solid var(--line);align-items:baseline}
.drow .pair{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.drow .x{color:var(--bad);text-decoration:line-through}
.drow .v{color:var(--ok);font-weight:600}
@media (max-width:519px){.trow,.brow,.drow{grid-template-columns:1fr}}

/* кнопки */
.btn{font:700 .95rem var(--ui);letter-spacing:.04em;text-transform:uppercase;background:var(--pink);color:var(--pink-ink);border:0;border-radius:2px;padding:.78em 1.2em;cursor:pointer;box-shadow:3px 3px 0 #000}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.ghost:hover{color:var(--pink);box-shadow:inset 0 0 0 1.5px var(--pink)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

/* упражнения */
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--muted);font-size:.88rem;margin-bottom:8px}
.meta>span:last-child{white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:0;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--pink) 0 8px,#ff6aa9 8px 16px);transition:width .25s}
.sent{font:500 clamp(1.2rem,4.4vw,1.5rem)/1.55 var(--ui);margin:4px 0 16px}
.gap{display:inline-block;min-width:3.4em;border-bottom:3px solid var(--pink);text-align:center;padding:0 .25em;font-weight:700}
.gap.got{color:var(--ok);border-color:var(--ok)}
.gap.rev{color:var(--bad);border-color:var(--bad)}
.vh{color:var(--muted);font-size:.82em;margin:0 .15em}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:479px){.opts{grid-template-columns:1fr}}
.opt{font:600 1.05rem var(--ui);padding:13px 12px;border-radius:2px;border:1.5px solid var(--edge);background:var(--sheet2);color:var(--ink);cursor:pointer;text-align:center}
.opt:hover:not([disabled]){border-color:var(--pink)}
.opt[disabled]{opacity:.35;cursor:default;text-decoration:line-through}
.opt.hit{opacity:1;text-decoration:none;border-color:var(--ok);color:var(--ok)}
.nopts{display:flex;flex-direction:column;gap:10px}
.nopt{text-align:left;font-weight:500;line-height:1.4}
.now-ctx{font-weight:600;color:var(--ink);border-left:4px solid var(--pink);padding:4px 0 4px 10px}
.buckets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bucket{text-align:left;border-radius:2px;border:2px solid var(--c);background:var(--sheet2);background:color-mix(in srgb,var(--c) 11%,var(--sheet));padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:4px;min-height:74px}
.bucket .bn{font:400 1.35rem/1.05 var(--marker);color:var(--c)}
.bucket .bf{font-size:.82rem;line-height:1.3;color:var(--muted)}
.bucket[disabled]{opacity:.3;cursor:default}
.bucket.hit{opacity:1;box-shadow:inset 0 0 0 2px var(--c),3px 3px 0 #000}
.fb{margin-top:14px;padding:10px 14px;border-radius:2px;background:var(--sheet2);border-left:4px solid var(--line)}
.fb.ok{border-left-color:var(--ok)} .fb.bad{border-left-color:var(--bad)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb .full{display:block;margin-top:6px;font-weight:600}
.speak{font:600 .9rem var(--ui);background:none;border:0;color:var(--ink);cursor:pointer;padding:6px 0 0;text-decoration:underline;text-decoration-color:var(--pink);text-underline-offset:3px}
.typerow{display:flex;gap:10px;flex-wrap:wrap}
.typerow input{flex:1 1 180px;min-width:0;font:600 1.15rem var(--ui);padding:10px 12px;border-radius:2px;border:1.5px solid var(--edge);background:var(--sheet2);color:var(--ink)}
.toks{font:500 clamp(1.2rem,4.4vw,1.5rem)/1.9 var(--ui);margin:4px 0 14px}
.tok{font:inherit;background:none;border:0;color:var(--ink);padding:0 .12em;border-radius:2px;cursor:pointer}
.tok:hover{background:var(--sheet2)}
.tok.plain{cursor:default;padding:0}
.tok.hl{outline:2px dashed var(--bad);outline-offset:2px}
.tok.sel{background:var(--pink);color:var(--pink-ink)}
.tok.fixed{color:var(--ok);font-weight:700}
.tok.gone{color:var(--bad);text-decoration:line-through}
.nope{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.nope{animation:none}.bar i{transition:none}}
.ru-src{font:600 clamp(1.2rem,4.8vw,1.55rem)/1.35 var(--ui);margin:4px 0 4px}
.ctx{color:var(--muted);font-size:.92rem;margin:0 0 12px}
.ansline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:52px;padding:6px 0 8px;border-bottom:2px solid var(--pink);margin:10px 0 14px}
.ansline .ph{color:var(--muted);font-size:.95rem}
.ansline.solved{font:700 clamp(1.1rem,4.4vw,1.4rem) var(--ui);color:var(--ok);border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 1rem var(--ui);padding:7px 12px;border-radius:2px;border:1.5px solid var(--edge);background:var(--sheet2);color:var(--ink);cursor:pointer}
.chip:hover{border-color:var(--pink)}
.ansline .chip{border-color:var(--pink)}
.hint{display:block;margin-top:6px;color:var(--muted);font-size:.92rem}
.big{font:400 3.8rem/1 var(--marker);margin:4px 0;color:var(--pink);transform:rotate(-2deg);display:inline-block}
.verdict{font:700 1.6rem/1.1 var(--hand);color:var(--ink);margin:0 0 8px}
.miss-h{margin-top:18px}
.miss{display:flex;flex-direction:column;align-items:flex-start;gap:2px;max-width:100%}
.miss-n{font-size:.82rem;color:var(--muted)}
.free-big{font-size:clamp(1.1rem,4vw,1.3rem)}
#free{width:100%;font:500 1.05rem/1.5 var(--ui);padding:10px 12px;border-radius:2px;border:1.5px solid var(--edge);background:var(--sheet2);color:var(--ink);resize:vertical;min-height:84px}
.free-tip{border-left:4px solid var(--pink);padding-left:10px}
.lint{margin:6px 0 0;padding-left:20px}
.free-row{border-top:1px solid var(--line);padding:8px 0}
.free-q{font-weight:600;margin:0 0 4px}

/* подвал */
.foot{text-align:center;padding:18px 16px 26px;color:var(--muted)}
.foot p{font:400 1.05rem/1.3 var(--marker);margin:0;transform:rotate(-1deg)}
.foot .heart{color:var(--pink)}
@media (max-width:380px){.setlist{padding:26px 16px 28px}.songs{gap:2px 8px}}
</style>
</head>
<body>
<div class="checker" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <nav class="setlist" aria-label="Этапы">
      <span class="tape" aria-hidden="true"></span><svg class="pin" viewBox="0 0 74 30" aria-hidden="true"><path d="M6 15 C6 8 14 5 22 8 L66 12 C71 12.5 71 17.5 66 18 L22 22 C14 25 6 22 6 15 Z" fill="none" stroke="#B9B6BF" stroke-width="2.4"/><path d="M14 15 L64 15" stroke="#D9D6DE" stroke-width="2.4" stroke-linecap="round"/><circle cx="10" cy="15" r="4.2" fill="#FF2E88"/></svg>
      <h1 class="band">if only</h1>
      <p class="venue"><span class="tour">conditionals tour</span> всё, что было бы, если бы</p>
      <ol class="songs" id="nav"></ol>
    </nav>
    <p class="saverow"><span>Прогресс сохраняется в этом браузере.</span><button class="linkbtn" data-wipe="1">Сбросить всё</button></p>
  </header>
  <main id="stage"></main>
  <div id="live" class="sr" aria-live="polite"></div>
</div>
<footer class="foot"><div class="checker" aria-hidden="true" style="margin:0 -16px 16px"></div><p lang="en">if only grammar were this easy <span class="heart" aria-hidden="true">&#9829;</span></p></footer>
<script>
const STAGES=["Узнать","Разложить","Сейчас или тогда","Выбрать","Вписать","Найти ошибку","Перевести","Сказать самой"];
const TY={
  z:{name:"Zero",f:"if + present, present"},
  f:{name:"First",f:"if + present, will"},
  s:{name:"Second",f:"if + past, would"},
  t:{name:"Third",f:"if + had V3, would have V3"},
  m:{name:"Mixed",f:"время в частях разное"},
  w:{name:"Wish / if only",f:"сожаление без if"}
};
const BK=["z","f","s","t","m","w"];

const SORT=[
  {s:"If I play The Black Parade too loud, my neighbours bang on the wall.",a:"z",why:"Так бывает каждый раз: present и present.",h:"Это случается каждый раз или один раз в будущем?"},
  {s:"If you wear cheap eyeliner in the rain, it runs.",a:"z",why:"Факт, так всегда — zero.",h:"Это одна ситуация или так бывает всегда?"},
  {s:"If I drink coffee after six, I can't sleep.",a:"z",why:"Так бывает всегда — zero. Can't тут как обычный present.",h:"Посмотри на время в обеих частях."},
  {s:"If they play Welcome to the Black Parade tonight, I'll scream.",a:"f",why:"Реально может случиться сегодня: present и will.",h:"Это может случиться — и в главной части есть will."},
  {s:"If you don't hurry, we'll miss the opening band.",a:"f",why:"Реальная угроза в будущем — first.",h:"Это реальная ситуация в будущем?"},
  {s:"If the merch stand still has my size, I'll buy the hoodie.",a:"f",why:"Может быть, а может нет — first.",h:"Размер может остаться — это возможно или воображаемо?"},
  {s:"If I had a record player, I would buy Riot! on vinyl.",a:"s",why:"Проигрывателя нет — воображаемое сейчас: past и would.",h:"Проигрыватель есть? Это про сейчас или про прошлое?"},
  {s:"If I were you, I'd stop texting him.",a:"s",why:"«На твоём месте» — воображаемое сейчас: were и would.",h:"Ты не можешь быть другим человеком. Это про сейчас."},
  {s:"If we lived in London, we would go to emo nights every week.",a:"s",why:"Мы не живём в Лондоне — воображаемое сейчас.",h:"Lived — прошедшая форма. Но речь правда о прошлом?"},
  {s:"If I had left earlier, I wouldn't have missed the first song.",a:"t",why:"Уже не изменить — воображаемое прошлое: had + V3 и would have + V3.",h:"Первая песня уже прозвучала. Это про прошлое?"},
  {s:"If she hadn't called, I would have forgotten about the exam.",a:"t",why:"Воображаемое прошлое — third.",h:"Посмотри на had и would have."},
  {s:"If we had bought tickets in May, we could have seen them live.",a:"t",why:"Could have — вариант would have, «смогли бы». Всё в прошлом — third.",h:"Could have — то же, что would have, только «смогли бы»."},
  {s:"If I hadn't heard Helena at fourteen, I wouldn't be an emo kid now.",a:"m",why:"Песню услышала в прошлом (had + V3), а результат — сейчас, now (would + V): mixed.",h:"Условие в прошлом. А результат тоже в прошлом?"},
  {s:"If I had chosen music instead of law, I'd be broke but happy now.",a:"m",why:"Выбор в прошлом, а now — сейчас: mixed.",h:"Посмотри на слово now в конце."},
  {s:"If I weren't so shy, I would have talked to the singer after the show.",a:"m",why:"Застенчивость — черта сейчас, а разговор — в прошлом: mixed.",h:"Weren't — про сейчас. А would have talked — про когда?"},
  {s:"I wish I had tickets for tonight.",a:"w",why:"Сожаление о настоящем: wish + past.",h:"Здесь нет if."},
  {s:"I wish I hadn't cut my own fringe.",a:"w",why:"Сожаление о прошлом: wish + had + V3. Fringe — чёлка (в американском bangs).",h:"Здесь нет if — есть другое слово сожаления."},
  {s:"If only you would stop checking your phone during the show.",a:"w",why:"If only — то же, что wish. Would — раздражение из-за чужого поведения.",h:"If only — это не обычное if."}
];

const CHOICE=[
  {s:"If it ___ during the open-air show, my eyeliner will run.",o:["rains","will rain","rained","would rain"],a:"rains",why:"После if будущее не ставим: if + present.",h:"По-русски «если пойдёт» — будущее. А в английском после if?",l:1},

/* проверка только типичных ошибок по форме, не по смыслу */
function lintFree(it,raw){
  const t=' '+norm(raw).replace(/[’]/g,"'")+' ',out=[];
  const clauses=t.match(/\b(if|when|unless|as soon as|in case|if only)\b[^,.;!?]*/g)||[];
  const hasCond=/\b(if|wish|unless|in case|should you|were i|had i)\b/.test(t);
  if(!hasCond)out.push("Здесь не видно условия. Попробуй if, wish, unless или in case.");
  clauses.forEach(c=>{
    if(/\b(will|won't)\b|'ll\b/.test(c))out.push("Похоже, will стоит в части с if, when или unless. Если это уже главная часть — поставь запятую после условия.");
    if(/\bwould(n't)?\b/.test(c)&&!/^if you would like/.test(c))out.push("Похоже, would стоит в части с if. Would бывает только в главной части. Если это уже главная часть — поставь запятую после условия.");
    if(/^unless\b/.test(c)&&/n't\b|\bnot\b/.test(c))out.push("После unless второе отрицание не нужно.");
  });
  if(/\bwish (i|we) would\b/.test(t))out.push("Wish + would — о чужом поведении. О себе: I wish I had / I wish I could / I wish I had + V3.");
  if(/\bwould of\b|\bcould of\b|\bshould of\b/.test(t))out.push("Would of — ошибка на письме. Правильно would have или would've.");
  if(it.need==='had'&&!/\bhad\b|\bhadn't\b|'d (been|gone|done|had|known|met|seen|chosen|learned|learnt|cut|left|bought|heard|taken|made)\b/.test(t))out.push("Не вижу had: для воображаемого прошлого обычно нужно had + V3.");
  if(it.need==='would'&&!/\bwould\b|'d\b|\bcould\b|\bmight\b|\bwouldn't\b/.test(t))out.push("Не вижу would (или could, might) в главной части.");
  if(it.need==='have'&&!/\b(would|could|might)(n't)? have\b|would've|'d have/.test(t))out.push("Результат в прошлом: нужно would have + V3.");
  if(it.need==='should'&&!/^ ?should you\b/.test(t))out.push("Попробуй начать со Should you…");
  return [...new Set(out)];
}

const canSpeak='speechSynthesis' in window;
let VOICE=null;
const normLang=l=>String(l||'').replace('_','-').toLowerCase();
function pickVoice(){
  let vs=[];try{vs=speechSynthesis.getVoices()||[];}catch(e){}
  const score=v=>{const l=normLang(v.lang),n=String(v.name||'').toLowerCase();let s;
    if(l==='en-gb')s=100;else if(l.startsWith('en'))s=40;else return -1;
    if(/google|natural|neural|enhanced|premium|siri/.test(n))s+=20;
    if(/compact|espeak|eloquence/.test(n))s-=15;return s;};
  let best=null,bs=-1;for(const v of vs){const sc=score(v);if(sc>bs){bs=sc;best=v;}}return best;
}
function speak(t){
  if(!canSpeak)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);const v=VOICE||(VOICE=pickVoice());
    u.lang=v?normLang(v.lang).replace(/-(\w+)$/,(m,r)=>'-'+r.toUpperCase()):'en-GB';if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u);}catch(e){}
}

  <section class="card trap">

    <div class="trow k-t"><span class="lab" style="color:var(--c)">Тогда, не знала</span><div class="exs">${say("If I [had known], I [would have come].")}</div></div>

  </section>
  <section class="card">
    <h2>Не только if ${lvlTag(2)}</h2>

       ["even if","«даже если»","I'm going to the gig [even if] it rains.",""],

      .map(([w,m,e,n])=>`<div class="brow"><div><div class="w">${w}</div><div class="m">${m}</div></div><div><div class="exs">${say(e)}</div>${n?`<p class="note">${n}</p>`:''}</div></div>`).join('')}

  <section class="card">
    <h2>If или when</h2>

    <p class="note">После when, as soon as, before, after и until — тоже без will: as soon as I arrive.</p>
  </section>
  <section class="card">
    <h2>Как читать I'd ${lvlTag(2)}</h2>

    ${[["[Should] you have any questions, please let me know.","= If you have any questions"],
       ["[Were] I in your position, I would accept.","= If I were in your position"],

      .map(([e,n])=>`<div class="brow"><div class="exs">${say(e)}</div><div class="m">${n}</div></div>`).join('')}

      .map(([r,x,v])=>`<div class="drow"><div>${r}</div><div class="pair"><span class="x">${x}</span><span class="v">${v}</span></div></div>`).join('')}

/* exercise helpers */
function qHead(q,label,l){
  const n=q.order.length;
  const rep=q.i<n&&isRep(q)?' <span class="tag again">Ещё раз</span>':'';
  const r2=q.round===2?' <span class="tag">Повтор ошибок</span>':'';
  return `<div class="meta"><span>${label}${l?' '+lvlTag(l):''}${r2}${rep}</span><span>${Math.min(q.i+1,n)} из ${n}</span></div><div class="bar"><i style="width:${(q.i+(q.solved?1:0))/n*100}%"></i></div>`;
}
/* правильная версия задания — для списка ошибок в конце */
function fullOf(key,it){
  if(key==='sort')return {en:it.s,note:TY[it.a].name};
  if(key==='now'){const c=it.o.find(o=>o[1]===it.a);return {en:c[0],note:it.ru+' — '+it.ctx};}
  if(key==='choice')return {en:it.s.replace('___',it.a)};
  if(key==='type')return {en:it.s.replace('___',it.acc[0])};
  if(key==='err'){const t=it.t.split(' '),[a,b]=it.e;return {en:join([...t.slice(0,a),it.fix,...t.slice(b+1)])};}
  if(key==='tr')return {en:it.s[0],note:it.ru};
}
function endHTML(q,key,next){
  const list=LISTS[key],miss=q.missed;
  const lead=q.round===2?'правильно с первой попытки в повторе ошибок.':'правильно с первой попытки.';
  const r=q.total?q.first/q.total:1,verdict=r===1?'Ни одной слезинки.':r>=.8?'Почти без драмы.':r>=.5?'Немного драмы — это нормально.':'Бывает. Повтори ошибки — и станет легче.';
  let h=`<section class="card"><p class="big">${q.first} / ${q.total}</p><p class="verdict">${verdict}</p><p>${lead}</p>`;
  if(miss.length){
    h+=`<h2 class="miss-h">Над чем ещё поработать</h2><p class="muted">Здесь были ошибки. Правильные версии — послушай и проговори вслух.</p>
    <div class="exs">${miss.map(i=>{const f=fullOf(key,list[i]);return `<div class="miss">${f.note?`<span class="miss-n">${esc(f.note)}</span>`:''}${say(f.en)}</div>`;}).join('')}</div>`;
  } else h+=`<p class="muted">Без единой ошибки.</p>`;
  h+=`<div class="row">${next!==null?`<button class="btn" data-go="${next}">Дальше</button>`:''}${miss.length?`<button class="btn${next===null?'':' ghost'}" data-retry="${key}">Повторить ошибки (${miss.length})</button>`:''}<button class="btn ghost" data-reset="${key}">Пройти всё заново</button></div></section>`;
  return h;
}
const cur=key=>LISTS[key][idxOf(S[key].order[S[key].i])];

function sortHTML(){
  const q=S.sort;if(q.i>=q.order.length)return endHTML(q,'sort',2);
  const it=cur('sort');
  let h=`<section class="card">${qHead(q,'Разложи по типам')}<p class="sent" lang="en">${esc(it.s)}</p>
  <div class="buckets">${BK.map(k=>`<button class="bucket k-${k}${q.solved===k?' hit':''}" data-bucket="${k}"${q.wrong.includes(k)||q.solved?' disabled':''}><span class="bn">${TY[k].name}</span><span class="bf">${TY[k].f}</span></button>`).join('')}</div>`;
  if(q.solved)h+=`<div class="fb ok"><b class="ok">Верно, ${TY[it.a].name}.</b> ${it.why}<br>${speakBtn(it.s)}</div><div class="row"><button class="btn" data-next="sort">Дальше</button></div>`;
  else if(q.wrong.length)h+=`<div class="fb bad"><b class="bad">Не сюда.</b> ${it.h}</div>`;
  return h+'</section>';
}

function nowHTML(){
  const q=S.now;if(q.i>=q.order.length)return endHTML(q,'now',3);
  const it=cur('now');if(!q.opts)q.opts=shuffle(it.o.map((_,i)=>i));
  let h=`<section class="card">${qHead(q,'Сейчас или тогда? Выбери перевод',it.l>1?it.l:0)}<p class="ru-src">${esc(it.ru)}</p><p class="ctx now-ctx">${esc(it.ctx)}</p>
  <div class="nopts" lang="en">${q.opts.map(i=>{const [t,k]=it.o[i];const hit=q.solved&&k===it.a;return `<button class="opt nopt${hit?' hit':''}" data-nopt="${i}"${q.wrong.includes(i)||q.solved?' disabled':''}>${esc(t)}</button>`;}).join('')}</div>`;
  if(q.solved){const c=it.o.find(o=>o[1]===it.a)[0];h+=`<div class="fb ok"><b class="ok">Верно.</b> ${it.why}<br>${speakBtn(c)}</div><div class="row"><button class="btn" data-next="now">Дальше</button></div>`;}
  else if(q.wrong.length){const k=it.o[q.wrong[q.wrong.length-1]][1];h+=`<div class="fb bad"><b class="bad">Не совсем.</b> ${MEAN[k]} ${it.h}</div>`;}
  return h+'</section>';
}

function choiceHTML(){
  const q=S.choice;if(q.i>=q.order.length)return endHTML(q,'choice',4);
  const it=cur('choice');if(!q.opts)q.opts=shuffle(it.o);
  const [pre,post]=it.s.split('___');
  let h=`<section class="card">${qHead(q,'Выбери форму',it.l>1?it.l:0)}
  <p class="sent" lang="en">${esc(pre)}<span class="gap${q.solved?' got':''}">${q.solved?esc(it.a):'&nbsp;'}</span>${esc(post)}</p>
  <div class="opts" lang="en">${q.opts.map((o,i)=>`<button class="opt${q.solved&&o===it.a?' hit':''}" data-opt="${i}"${q.wrong.includes(o)||q.solved?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  if(q.solved){const full=it.s.replace('___',it.a);h+=`<div class="fb ok"><b class="ok">Верно.</b> ${it.why}<br>${speakBtn(full)}</div><div class="row"><button class="btn" data-next="choice">Дальше</button></div>`;}
  else if(q.wrong.length)h+=`<div class="fb bad"><b class="bad">Не совсем.</b> ${it.h}</div>`;
  return h+'</section>';
}

function typeHTML(){
  const q=S.type;if(q.i>=q.order.length)return endHTML(q,'type',5);
  const it=cur('type');const [pre,post]=it.s.split('___');
  const shown=q.solved?(q.revealed?it.acc[0]:q.solved):'';
  let h=`<section class="card">${qHead(q,'Впиши форму глагола',it.l>1?it.l:0)}
  <p class="sent" lang="en">${esc(pre)}<span class="gap${q.solved?(q.revealed?' rev':' got'):''}">${q.solved?esc(shown):'&nbsp;'}</span>${q.solved?'':`<span class="vh">(${esc(it.v)})</span>`}${esc(post)}</p>`;
  if(!q.solved){
    h+=`<div class="typerow"><input id="ans" lang="en" value="${esc(q.typed)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Форма глагола" aria-label="Форма глагола ${esc(it.v)}"><button class="btn" data-check="1">Проверить</button></div>`;
    if(q.msg)h+=`<div class="fb bad"><b class="bad">Не совсем.</b> ${q.msg}</div>`;
  } else {
    const full=it.s.replace('___',shown);
    const note=(!q.revealed&&it.alt&&it.alt[norm(q.solved)])?' '+it.alt[norm(q.solved)]:'';
    h+=q.revealed?`<div class="fb bad"><b class="bad">Правильно так:</b> <span class="full">${esc(full)}</span>${it.why}<br>${speakBtn(full)}</div>`
                 :`<div class="fb ok"><b class="ok">Верно.</b> ${it.why}${note}<br>${speakBtn(full)}</div>`;
    h+=`<div class="row"><button class="btn" data-next="type">Дальше</button></div>`;
  }
  return h+'</section>';
}

function errHTML(){
  const q=S.err;if(q.i>=q.order.length)return endHTML(q,'err',6);
  const it=cur('err'),toks=it.t.split(' '),[a,b]=it.e;
  let h=`<section class="card">${qHead(q,'В каждом предложении одна ошибка',it.l>1?it.l:0)}<p class="toks" lang="en">`;
  h+=toks.map((t,i)=>{
    if(isP(t))return `<span>${t}</span>`;
    const sp=i>0?' ':'';const inR=i>=a&&i<=b;
    if(q.solved){
      if(inR){const struck=`<span class="tok plain gone">${esc(t)}</span>`;return sp+struck+(i===b?` <span class="tok plain fixed">${esc(it.fix)}</span>`:'');}
      return sp+`<span class="tok plain">${esc(t)}</span>`;
    }
    if(q.open)return sp+`<span class="tok plain${inR?' sel':''}">${esc(t)}</span>`;
    return sp+`<button class="tok${inR&&q.hinted?' hl':''}" data-tok="${i}">${esc(t)}</button>`;
  }).join('')+'</p>';
  if(q.solved){
    const fixed=join([...toks.slice(0,a),it.fix,...toks.slice(b+1)]);
    h+=q.revealed?`<div class="fb bad"><b class="bad">Правильно так:</b> <span class="full">${esc(fixed)}</span>${it.why}<br>${speakBtn(fixed)}</div>`
                 :`<div class="fb ok"><b class="ok">Верно.</b> <span class="full">${esc(fixed)}</span>${it.why}<br>${speakBtn(fixed)}</div>`;
    h+=`<div class="row"><button class="btn" data-next="err">Дальше</button></div>`;
  } else if(q.open){
    h+=`<p class="muted">Чем заменить «${esc(join(toks.slice(a,b+1)))}»?</p><div class="opts" lang="en">${q.opts.map((o,i)=>`<button class="opt" data-fix="${i}"${q.wrongOpts.includes(i)?' disabled':''}>${esc(o)}</button>`).join('')}</div>`;
    if(q.wrongOpts.length)h+=`<div class="fb bad"><b class="bad">Не совсем.</b> ${it.h}</div>`;
  } else {
    h+=`<p class="muted">Нажми на слово с ошибкой.</p>`;
    if(q.msg)h+=`<div class="fb bad">${q.msg}</div>`;
    h+=`<div class="row"><button class="btn ghost" data-hint="1">Подсказка</button></div>`;
  }
  return h+'</section>';
}

function tilesFor(it){
  const bag=[];
  it.a.forEach(ans=>{const c={};ans.forEach(w=>{c[w]=(c[w]||0)+1;});
    Object.entries(c).forEach(([w,n])=>{const have=bag.filter(x=>x===w).length;for(let k=have;k<n;k++)bag.push(w);});});
  return shuffle(bag.concat(it.x));
}
function freeHTML(){
  const q=S.free,n=q.order.length;
  if(q.i>=n){
    const rows=q.order.map((idx,k)=>({it:FREE[idx],a:(q.ans[idx]||'').trim(),k}));
    const done=rows.filter(r=>r.a).length;
    return `<section class="card"><p class="big">${done} / ${n}</p><p>ответов написано.</p>
    <p class="muted">Скопируй ответы и пришли преподавателю — он проверит смысл и всё, что тренажёр не ловит.</p>
    <div class="free-list">${rows.map(r=>`<div class="free-row"><p class="free-q">${r.k+1}. ${esc(r.it.q)}</p><p class="${r.a?'':'muted'}">${r.a?esc(r.a):'— без ответа —'}</p></div>`).join('')}</div>
    <div class="row"><button class="btn" data-fcopy="1">Скопировать ответы</button><button class="btn ghost" data-freset="1">Начать заново</button></div>
    <p class="muted copied" id="copied" aria-live="polite">${q.copied?'Скопировано.':''}</p></section>`;
  }
  const idx=q.order[q.i],it=FREE[idx],val=q.ans[idx]||'';
  let h=`<section class="card"><div class="meta"><span>Ответь по-английски${it.l>1?' '+lvlTag(it.l):''}</span><span>${q.i+1} из ${n}</span></div><div class="bar"><i style="width:${(q.i+(q.checked?1:0))/n*100}%"></i></div>
  <p class="sent free-big" lang="en">${esc(it.q)}</p><p class="ctx">${esc(it.ru)}</p>
  <textarea id="free" lang="en" rows="3" placeholder="Пиши полным предложением" aria-label="Твой ответ" autocapitalize="sentences" spellcheck="false">${esc(val)}</textarea>
  ${q.tip?`<p class="note free-tip">${esc(it.tip)}</p>`:''}
  <div class="row"><button class="btn" data-fcheck="1">Проверить</button>${q.tip?'':'<button class="btn ghost" data-ftip="1">Подсказка по форме</button>'}${q.checked?'':'<button class="btn ghost" data-fnext="1">Пропустить</button>'}</div>`;
  if(q.checked){
    const L=q.lint;
    h+=L.length?`<div class="fb bad"><b class="bad">Проверь:</b><ul class="lint">${L.map(m=>`<li>${esc(m)}</li>`).join('')}</ul><span class="hint">Это подсказки, а не приговор: тренажёр мог ошибиться. Можешь исправить и проверить ещё раз.</span></div>`
              :`<div class="fb ok"><b class="ok">Типичных ошибок не видно.</b> Сверь с образцом: те же ли формы у тебя?</div>`;
    h+=`<p class="muted" style="margin-top:14px">Как можно ответить:</p><div class="exs">${it.m.map(say).join('')}</div>
    <div class="row"><button class="btn" data-fnext="1">Дальше</button></div>`;
  }
  return h+`<p class="note">Тренажёр ловит только типичные ошибки формы: will после if, would в части с if и т.п. Смысл и остальную грамматику он не проверяет.</p></section>`;
}
function freshFree(old){return {order:pool(FREE),i:0,checked:false,lint:[],tip:false,copied:false,ans:old?old.ans:{}};}
function checkFree(){
  const q=S.free,idx=q.order[q.i],v=(q.ans[idx]||'').trim();
  if(!v){q.checked=false;q.lint=[];FOCUS='#free';render();return;}
  q.lint=lintFree(FREE[idx],v);q.checked=true;FOCUS='none';render();
}
function nextFree(){const q=S.free;q.i++;q.checked=false;q.lint=[];q.tip=false;FOCUS=q.i>=q.order.length?'.row .btn':'#free';markDone();render();}
function copyFree(){
  const q=S.free,txt='if only — свободные ответы\n\n'+q.order.map((idx,k)=>`${k+1}. ${FREE[idx].q}\n${(q.ans[idx]||'—').trim()}`).join('\n\n');
  const ok=()=>{q.copied=true;const el=$('#copied');if(el)el.textContent='Скопировано.';};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){}ta.remove();};
  try{navigator.clipboard.writeText(txt).then(ok,fallback);}catch(e){fallback();}
}

function trHTML(){
  const q=S.tr;if(q.i>=q.order.length)return endHTML(q,'tr',7);
  const it=cur('tr');if(!q.tiles){q.tiles=tilesFor(it);q.ans=[];}
  let h=`<section class="card">${qHead(q,'Переведи: собери из плиток',it.l>1?it.l:0)}<p class="ru-src">${esc(it.ru)}</p>${it.ctx?`<p class="ctx">${esc(it.ctx)}</p>`:''}`;
  if(q.solved){
    const sent=q.flip||it.s[q.pick],note=q.flip?' Тоже верно: главная часть может идти первой — тогда запятая не нужна.':((!q.revealed&&it.n&&it.n[q.pick])?' '+it.n[q.pick]:'');
    h+=`<div class="ansline solved" lang="en">${esc(sent)}</div>`;
    h+=q.revealed?`<div class="fb bad"><b class="bad">Правильно так:</b> <span class="full">${esc(sent)}</span>${it.why}<br>${speakBtn(sent)}</div>`
                 :`<div class="fb ok"><b class="ok">Верно.</b> ${it.why}${note}<br>${speakBtn(sent)}</div>`;
    h+=`<div class="row"><button class="btn" data-next="tr">Дальше</button></div>`;
  } else {
    const poolIdx=q.tiles.map((_,i)=>i).filter(i=>!q.ans.includes(i));
    h+=`<div class="ansline" aria-label="Твой ответ">${q.ans.length?q.ans.map((i,k)=>`<button class="chip" data-tout="${i}" aria-label="Убрать ${esc(tl(q.tiles[i]))}" lang="en">${esc(k===0?cap(tl(q.tiles[i])):tl(q.tiles[i]))}</button>`).join(''):'<span class="ph">Нажимай на плитки по порядку. Запятые не нужны.</span>'}</div>
    <div class="chips pool">${poolIdx.map(i=>`<button class="chip" data-tin="${i}" lang="en">${esc(tl(q.tiles[i]))}</button>`).join('')}</div>
    <div class="row"><button class="btn" data-trcheck="1">Проверить</button><button class="btn ghost" data-trclear="1">Сбросить</button></div>`;
    if(q.msg)h+=`<div class="fb bad">${q.msg}</div>`;
  }
  return h+'</section>';
}

/* actions */
function render(){
  renderNav();
  $('#stage').innerHTML=[learnHTML,sortHTML,nowHTML,choiceHTML,typeHTML,errHTML,trHTML,freeHTML][S.tab]();
  const fa=$('#free');
  if(fa){fa.addEventListener('input',()=>{S.free.ans[S.free.order[S.free.i]]=fa.value;save();});if(FOCUS==='#free'){fa.focus({preventScroll:true});FOCUS=null;}}
  const inp=$('#ans');
  if(inp){
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();checkType(inp.value);}});
    if(FOCUS&&FOCUS!=='none'&&inp.matches(FOCUS)){inp.focus({preventScroll:true});if(S.type.msg&&inp.value)inp.select();}
    else if(FOCUS&&FOCUS!=='none'){const el=$(FOCUS);if(el)el.focus({preventScroll:true});}
  } else if(FOCUS&&FOCUS!=='none'){
    const el=$(FOCUS);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',behavior:reduceMotion()?'auto':'smooth'});}
  }
  FOCUS=null;
  if(SHAKE!==null){const el=$(`[data-tok="${SHAKE}"]`);if(el)el.classList.add('nope');SHAKE=null;}
  const fb=$('#stage .fb'),txt=fb?fb.textContent.replace('Послушать','').trim():'';
  if(txt!==LIVE){LIVE=txt;$('#live').textContent=txt;}
  save();
}
function markDone(){for(const k in TABKEY){if(S[k].i>=S[k].order.length)S.done[TABKEY[k]]=true;}if(S.free.i>=S.free.order.length)S.done[7]=true;}
function go(i){if(S.tab===0)S.done[0]=true;S.tab=i;LIVE='';render();window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});}

function pickBucket(k){
  const q=S.sort,it=cur('sort');
  if(k===it.a){q.solved=k;if(!q.wrong.length)credit(q);FOCUS=NEXT_FOCUS;}
  else{q.wrong.push(k);FOCUS='.bucket:not([disabled])';}
  render();
}
function chooseNow(i){
  const q=S.now,it=cur('now');
  if(it.o[i][1]===it.a){q.solved=true;if(!q.wrong.length)credit(q);FOCUS=NEXT_FOCUS;}
  else{q.wrong.push(i);FOCUS='.nopt:not([disabled])';}
  render();
}
function chooseOpt(i){
  const q=S.choice,it=cur('choice'),o=q.opts[i];
  if(o===it.a){q.solved=true;if(!q.wrong.length)credit(q);FOCUS=NEXT_FOCUS;}
  else{q.wrong.push(o);FOCUS='.opt:not([disabled])';}
  render();
}
/* разбор конкретной ошибки во «Вписать» */
const DM={
  willIf:"После if, when, as soon as и unless will не ставим — даже если по-русски будущее.",
  willWish:"После wish и if only will не ставим: нужен шаг назад во времени.",
  willMain:"Это воображаемое — will не подходит, нужно would.",
  wouldIf:"Would в части с if не ставим — он бывает только в главной части.",
  wouldWish:"Wish + would — только о чужом поведении. О себе — шаг назад: past simple или had + V3.",
  needHave:"Результат здесь в прошлом: would have + V3.",
  noHave:"Результат здесь про сейчас: would + V, без have.",
  needWould:"В главной части воображаемого нужно would.",
  needPP:"Это про прошлое. Past simple здесь значил бы воображаемое сейчас — нужен ещё шаг назад: had + V3.",
  backPast:"Воображаемое сейчас — шаг назад во времени: present → past simple.",
  wishBack:"После wish — шаг назад: present → past simple.",
  ppTooFar:"Had + V3 — это уже про прошлое. А здесь воображаемое сейчас: хватит past simple.",
  realPres:"Это реальная ситуация, не воображаемая, — нужен present.",
  neg:"В скобках есть not — не забудь отрицание.",
  unless:"Unless уже значит «если не» — второе отрицание не нужно.",
  invIf:"Здесь без if: инверсия начинается сразу с глагола.",
  invWas:"В инверсии только were: Were I in your position.",
  thirdS:"The band — это he/she/it: нужно окончание -s."
};
function diagType(it,raw){
  const t=norm(raw),w=t.split(' '),has=re=>re.test(t);
  const base=it.v.replace(/^not \/ /,''),neg=/^not \//.test(it.v),exp=norm(it.acc[0]);
  const isNeg=has(/n't\b|\bnot\b/);
  if(/^unless/i.test(it.s)&&isNeg)return DM.unless;
  if(neg&&!isNeg)return DM.neg;
  if(it.g==='inv'){if(has(/^if\b/))return DM.invIf;if(t==='was')return DM.invWas;}
  if(exp===base+'s'&&t===base)return DM.thirdS;
  let ki;
  if(has(/\b(will|won't)\b|'ll\b/))ki='will';
  else if(has(/\b(would|wouldn't)\b|would've|'d have|'d've/))ki=has(/\bhave\b|'ve\b/)?'whv':'wv';
  else if(has(/^(had|hadn't)\b|^'d\b/))ki='pp';
  else{const last=w[w.length-1];ki=(last===base||last===base+'s'||last===base+'es'||/^(do|does|don't|doesn't|am|is|are|isn't|aren't)$/.test(w[0]))?'pres':'past';}
  if(ki==='will')return it.g==='main'?DM.willMain:it.g==='wish'?DM.willWish:DM.willIf;
  if((ki==='wv'||ki==='whv')&&it.g!=='main')return it.g==='wish'?DM.wouldWish:DM.wouldIf;
  if(it.g==='main'){
    if(it.k==='whv'&&ki==='wv')return DM.needHave;
    if(it.k==='wv'&&ki==='whv')return DM.noHave;
    if(ki!=='wv'&&ki!=='whv')return DM.needWould;
  }
  if(it.k==='pp'&&(ki==='past'||ki==='pres'))return DM.needPP;
  if(it.k==='past'&&ki==='pres')return it.g==='wish'?DM.wishBack:DM.backPast;
  if(it.k==='past'&&ki==='pp')return DM.ppTooFar;
  if(it.k==='pres'&&(ki==='past'||ki==='pp'))return DM.realPres;
  if(ki===it.k)return (it.k==='pp'||it.k==='whv')?`Конструкция верная — проверь третью форму глагола ${base}.`:'Конструкция верная — проверь форму самого глагола.';
  return null;
}
/* разбор конкретной ошибки в «Перевести» */
const nWords=n=>n%10===1&&n%100!==11?'слова':'слов';
function diagTr(it,got){
  const cnt=a=>a.reduce((m,w)=>(m[w]=(m[w]||0)+1,m),{});
  const G=cnt(got);let best=null;
  it.a.forEach(ans=>{const A=cnt(ans),extra=[],miss=[];
    for(const w in G)for(let k=(A[w]||0);k<G[w];k++)extra.push(w);
    for(const w in A)for(let k=(G[w]||0);k<A[w];k++)miss.push(w);
    const sc=extra.length+miss.length;if(!best||sc<best.sc)best={sc,extra,miss,ans};});
  const xn=it.xn||{};
  for(const w of best.extra)if(xn[w])return xn[w];
  if(!best.sc){let i=0;while(got[i]===best.ans[i])i++;
    return i>0?`Все слова верные, но порядок другой. Начало «${esc(join(got.slice(0,i)))}» — правильно, дальше проверь.`:'Все слова верные, но порядок другой. Проверь, с чего начинается фраза.';}
  if(!best.extra.length)return `Фраза не закончена: не хватает ещё ${best.miss.length} ${nWords(best.miss.length)}.`;
  return null;
}
const withHint=(d,h)=>d?`${d}<span class="hint">Подсказка: ${h}</span>`:h;
function checkType(raw){
  const q=S.type,it=cur('type');q.typed=raw;const v=norm(raw);
  if(!v){q.msg='Впиши форму глагола.';FOCUS='#ans';LIVE='';render();return;}
  if(it.acc.map(norm).includes(v)){q.solved=raw.trim();q.msg=null;if(q.tries===0)credit(q);FOCUS=NEXT_FOCUS;render();return;}
  q.tries++;
  if(q.tries>=2){q.solved=it.acc[0];q.revealed=true;q.msg=null;FOCUS=NEXT_FOCUS;}
  else{q.msg=withHint(diagType(it,raw),it.h);FOCUS='#ans';LIVE='';}
  render();
}
function tapTok(i){
  const q=S.err,it=cur('err'),[a,b]=it.e;
  if(i>=a&&i<=b){q.open=true;q.msg=null;q.opts=shuffle([it.fix,...it.o]);FOCUS='[data-fix]';}
  else{q.misses++;q.msg='Это слово на месте. Ищи глагол или связку, где ошибка.';SHAKE=i;FOCUS=`[data-tok="${i}"]`;LIVE='';}
  render();
}
function fixErr(i){
  const q=S.err,it=cur('err');
  if(q.opts[i]===it.fix){q.solved=true;if(!q.misses&&!q.hinted&&!q.wrongOpts.length)credit(q);FOCUS=NEXT_FOCUS;}
  else{q.wrongOpts.push(i);if(q.wrongOpts.length>=2){q.solved=true;q.revealed=true;FOCUS=NEXT_FOCUS;}else FOCUS='[data-fix]:not([disabled])';}
  render();
}
function checkTr(){
  const q=S.tr,it=cur('tr'),got=q.ans.map(i=>q.tiles[i]).join(' ');
  if(!got){q.msg='Собери фразу из плиток.';FOCUS='.pool .chip';LIVE='';render();return;}
  let k=it.a.findIndex(v=>v.join(' ')===got);q.flip=null;
  /* главная часть первой — тоже верно (I'll text you when I get…) */
  if(k<0){const lc=a=>a.join(' ').toLowerCase(),g=q.ans.map(i=>q.tiles[i]);
    k=it.a.findIndex((v,j)=>{if(!/^(If|Unless|When)$/.test(v[0]))return false;const n=it.s[j].split(',')[0].split(' ').length;return lc([...v.slice(n),...v.slice(0,n)])===lc(g);});
    if(k>=0){const t=g.map((w,i)=>i===0?w[0].toUpperCase()+w.slice(1):(/^(If|Unless|When)$/.test(w)?w.toLowerCase():w));q.flip=t.join(' ')+'.';}}
  if(k>=0){q.solved=true;q.pick=k;q.msg=null;if(q.tries===0)credit(q);FOCUS=NEXT_FOCUS;render();return;}
  q.tries++;
  if(q.tries>=2){q.solved=true;q.pick=0;q.revealed=true;q.msg=null;FOCUS=NEXT_FOCUS;}
  else{q.msg=`<b class="bad">Не совсем.</b> ${withHint(diagTr(it,q.ans.map(i=>q.tiles[i])),it.h)}`;FOCUS='[data-trcheck]';LIVE='';}
  render();
}
function nextQ(key){
  const q=S[key];
  if(!q.ok){
    const v=q.order[q.i],idx=idxOf(v);
    if(!q.missed.includes(idx))q.missed.push(idx);
    /* ошибка в первом показе — задание вернётся через 3–5 других */
    if(v>=0){const gap=3+Math.floor(Math.random()*3);q.order.splice(Math.min(q.i+1+gap,q.order.length),0,-(idx+1));}
  }
  q.i++;
  Object.assign(q,{ok:false,wrong:[],solved:false,revealed:false,tries:0,msg:null,typed:'',opts:null,open:false,wrongOpts:[],misses:0,hinted:false,tiles:null,ans:[],pick:0,flip:null});
  FOCUS={sort:'.bucket',now:'.nopt',choice:'.opt',type:'#ans',err:'[data-tok]',tr:'.pool .chip'}[key];
  if(q.i>=q.order.length)FOCUS='.row .btn';
  markDone();render();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab!==undefined){FOCUS=`[data-tab="${+d.tab}"]`;go(+d.tab);}
  else if(d.go!==undefined){FOCUS='#stage button';go(+d.go);}
  else if(d.say!==undefined)speak(d.say);
  else if(d.bucket!==undefined)pickBucket(d.bucket);
  else if(d.opt!==undefined)chooseOpt(+d.opt);
  else if(d.nopt!==undefined)chooseNow(+d.nopt);
  else if(d.check!==undefined)checkType(($('#ans')||{}).value||'');
  else if(d.next!==undefined)nextQ(d.next);
  else if(d.tok!==undefined)tapTok(+d.tok);
  else if(d.fix!==undefined)fixErr(+d.fix);
  else if(d.hint!==undefined){S.err.hinted=true;S.err.msg='Ошибка в словах, обведённых пунктиром.';FOCUS='.tok.hl';render();}
  else if(d.tin!==undefined){S.tr.ans.push(+d.tin);S.tr.msg=null;FOCUS='.pool .chip, [data-trcheck]';render();}
  else if(d.tout!==undefined){S.tr.ans=S.tr.ans.filter(i=>i!==+d.tout);S.tr.msg=null;FOCUS='.ansline .chip, .pool .chip';render();}
  else if(d.trclear!==undefined){S.tr.ans=[];S.tr.msg=null;FOCUS='.pool .chip';render();}
  else if(d.trcheck!==undefined)checkTr();
  else if(d.fcheck!==undefined)checkFree();
  else if(d.fnext!==undefined)nextFree();
  else if(d.ftip!==undefined){S.free.tip=true;FOCUS='#free';render();}
  else if(d.fcopy!==undefined)copyFree();
  else if(d.wipe!==undefined){if(confirm('Сбросить прогресс во всех упражнениях и свободные ответы?')){try{localStorage.removeItem(SAVE_KEY);}catch(e){}resetAll();LIVE='';render();window.scrollTo(0,0);}}
  else if(d.freset!==undefined){S.free=freshFree();S.done[7]=false;FOCUS='#free';render();}
  else if(d.retry!==undefined){const k=d.retry;S[k]=freshQ(k,S[k].missed.slice());S.done[TABKEY[k]]=false;FOCUS='#stage .bucket, #stage .opt, #stage [data-tok], #stage .chip, #stage input';LIVE='';render();window.scrollTo({top:0,behavior:reduceMotion()?'auto':'smooth'});}
  else if(d.reset!==undefined){const k=d.reset;S[k]=freshQ(k);S.done[TABKEY[k]]=false;FOCUS='#stage .bucket, #stage .opt, #stage [data-tok], #stage .chip';LIVE='';render();}
});

/* сохранение в браузере ученика. Поменяй версию в ключе, если меняешь состав заданий */
const SAVE_KEY='ifonly-conditionals-v1';
const SIG=JSON.stringify([STAGES.length,SORT.length,NOW.length,CHOICE.length,TYPE.length,ERR.length,TR.length,FREE.length]);
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({sig:SIG,S}));}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(d&&d.sig===SIG&&d.S&&d.S.free&&Array.isArray(d.S.done)){S=d.S;S.free.copied=false;}}catch(e){}}
resetAll();load();render();
</script>
